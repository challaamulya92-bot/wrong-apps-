<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Fast Verify</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .stat-card {
      background: white;
      border: 1px solid rgba(203, 213, 225, 0.7);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .stat-card h3 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #0f172a;
    }
    .stat-card p {
      margin: 0;
      color: #475569;
    }
    .messages-list {
      margin-top: 40px;
      background: white;
      border: 1px solid rgba(203, 213, 225, 0.7);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
    }
    .messages-list h3 {
      margin-bottom: 20px;
    }
    .message-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
    }
    .message-item:last-child {
      border-bottom: none;
    }
    .message-text {
      font-weight: 600;
      margin-bottom: 5px;
    }
    .message-meta {
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="site-nav">
      <a class="brand" href="index.html">Fast Verify</a>
      <div class="nav-actions">
        <a class="button secondary" href="index.html">Home</a>
        <a class="button secondary" href="about.html">About</a>
        <a class="button secondary" href="features.html">Features</a>
        <a class="button secondary" href="demo.html">Demo</a>
        <a class="button secondary" href="team.html">Team</a>
        <a class="button secondary" href="contact.html">Contact</a>
        <a class="button primary" href="home.html">Verify now</a>
      </div>
    </nav>

    <header class="hero">
      <span class="badge">Dashboard</span>
      <h1>Admin Dashboard</h1>
      <p>Overview of Fast Verify data and statistics.</p>
      <p class="impact-statement">Monitor app performance and community engagement.</p>
      <div class="hero-actions">
        <a class="button secondary" href="login-listers.html">View Full Database</a>
      </div>
    </header>

    <main>
      <div class="dashboard-grid" id="stats">
        <!-- Stats will be loaded here -->
      </div>

      <div class="messages-list">
        <h3>Recent Messages</h3>
        <div id="messages">
          <!-- Messages will be loaded here -->
        </div>
      </div>
    </main>
  </div>

  <script>
    // Load data from data.json
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        displayStats(data);
        displayMessages(data.messages);
      })
      .catch(error => console.error('Error loading data:', error));

    function displayStats(data) {
      const messages = data.messages;
      const totalVotes = messages.reduce((sum, msg) => sum + msg.votes.fake + msg.votes.real, 0);
      const avgScore = messages.reduce((sum, msg) => sum + msg.score, 0) / messages.length;

      const statsHtml = `
        <div class="stat-card">
          <h3>${messages.length}</h3>
          <p>Total Messages Verified</p>
        </div>
        <div class="stat-card">
          <h3>${totalVotes}</h3>
          <p>Total Community Votes</p>
        </div>
        <div class="stat-card">
          <h3>${avgScore.toFixed(1)}%</h3>
          <p>Average Truth Score</p>
        </div>
        <div class="stat-card">
          <h3>${data.users.length}</h3>
          <p>Active Users</p>
        </div>
      `;
      document.getElementById('stats').innerHTML = statsHtml;
    }

    function displayMessages(messages) {
      const messagesHtml = messages.map(msg => `
        <div class="message-item">
          <div class="message-text">${msg.text}</div>
          <div class="message-meta">Score: ${msg.score}% | Votes: ${msg.votes.fake} fake, ${msg.votes.real} real | Risk: ${msg.forwardRisk}</div>
        </div>
      `).join('');
      document.getElementById('messages').innerHTML = messagesHtml;
    }
  </script>
</body>
</html>
