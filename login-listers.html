<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Listers - Fast Verify</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .data-section {
      background: white;
      border: 1px solid rgba(203, 213, 225, 0.7);
      border-radius: 28px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
    }
    .data-section h3 {
      margin-bottom: 20px;
      color: #0f172a;
    }
    .data-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
    }
    .data-item:last-child {
      border-bottom: none;
    }
    .data-label {
      font-weight: 600;
      color: #374151;
    }
    .data-value {
      color: #6b7280;
    }
    .user-info {
      background: #f0f9ff;
      border: 1px solid #0ea5e9;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .user-info h3 {
      color: #0c4a6e;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="site-nav">
      <a class="brand" href="index.html">Fast Verify</a>
      <div class="nav-actions">
        <a class="button secondary" href="index.html">Home</a>
        <a class="button secondary" href="about.html">About</a>
        <a class="button secondary" href="features.html">Features</a>
        <a class="button secondary" href="demo.html">Demo</a>
        <a class="button secondary" href="team.html">Team</a>
        <a class="button secondary" href="contact.html">Contact</a>
        <a class="button primary" href="home.html">Verify now</a>
      </div>
    </nav>

    <header class="hero">
      <span class="badge">Login Listers</span>
      <h1>Login Listers</h1>
      <p>View stored messages, users, and your login information.</p>
      <p class="impact-statement">Access restricted to logged-in users.</p>
    </header>

    <main>
      <div id="userInfo" class="user-info" style="display: none;">
        <h3>Your Information</h3>
        <div id="userDetails"></div>
      </div>

      <div class="data-section">
        <h3>Messages Database</h3>
        <div id="messagesData"></div>
      </div>

      <div class="data-section">
        <h3>Users Database</h3>
        <div id="usersData"></div>
      </div>
    </main>
  </div>

  <script>
    // Check if user is logged in
    const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
    if (!loggedInUser) {
      alert('Please log in first.');
      window.location.href = 'login.html';
    } else {
      // Display user info
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('userDetails').innerHTML = `
        <p><strong>Username:</strong> ${loggedInUser.username}</p>
        <p><strong>Role:</strong> ${loggedInUser.role}</p>
        <p><strong>ID:</strong> ${loggedInUser.id}</p>
        <p><strong>Email:</strong> ${loggedInUser.email}</p>
        <p><strong>Address:</strong> ${loggedInUser.address}</p>
        <p><strong>Date of Birth:</strong> ${loggedInUser.dateOfBirth}</p>
        <p><strong>Qualification:</strong> ${loggedInUser.qualification}</p>
      `;

      // Load and display database data
      fetch('data.json')
        .then(response => response.json())
        .then(data => {
          displayMessages(data.messages);
          displayUsers(data.users);
        })
        .catch(error => console.error('Error loading data:', error));
    }

    function displayMessages(messages) {
      const html = messages.map(msg => `
        <div class="data-item">
          <div class="data-label">ID: ${msg.id}</div>
          <div class="data-value">Text: ${msg.text}</div>
          <div class="data-value">Score: ${msg.score}% | Language: ${msg.language} | Screenshot: ${msg.isScreenshot ? 'Yes' : 'No'}</div>
          <div class="data-value">Votes: Fake: ${msg.votes.fake}, Real: ${msg.votes.real} | Risk: ${msg.forwardRisk}</div>
          <div class="data-value">Viral Spread: ${msg.viralSpread}</div>
        </div>
      `).join('');
      document.getElementById('messagesData').innerHTML = html;
    }

    function displayUsers(users) {
      const html = users.map(user => `
        <div class="data-item">
          <div class="data-label">ID: ${user.id}</div>
          <div class="data-value">Username: ${user.username} | Role: ${user.role}</div>
          <div class="data-value">Email: ${user.email} | Address: ${user.address}</div>
          <div class="data-value">DOB: ${user.dateOfBirth} | Qualification: ${user.qualification}</div>
        </div>
      `).join('');
      document.getElementById('usersData').innerHTML = html;
    }
  </script>
</body>
</html>
