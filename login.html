<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Fast Verify Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-form {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(203, 213, 225, 0.7);
    }
    .login-form h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #4338ca;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #3730a3;
    }
    .error {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #4338ca;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
    }
    .register-fields {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="site-nav">
      <a class="brand" href="index.html">Fast Verify</a>
      <div class="nav-actions">
        <a class="button secondary" href="index.html">Home</a>
        <a class="button secondary" href="about.html">About</a>
        <a class="button secondary" href="features.html">Features</a>
        <a class="button secondary" href="demo.html">Demo</a>
        <a class="button secondary" href="team.html">Team</a>
        <a class="button secondary" href="contact.html">Contact</a>
        <a class="button primary" href="home.html">Verify now</a>
      </div>
    </nav>

    <div class="login-form">
      <h2 id="formTitle">Login</h2>
      <form id="authForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="register-fields">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email">
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address">
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">
          </div>
          <div class="form-group">
            <label for="qualification">Qualification</label>
            <select id="qualification">
              <option value="">Select</option>
              <option value="Student">Student</option>
              <option value="Job Holder">Job Holder</option>
              <option value="Worker">Worker</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <button type="submit" class="login-btn" id="submitBtn">Login</button>
      </form>
      <button class="toggle-btn" id="toggleBtn">Don't have an account? Register</button>
      <div id="error" class="error" style="display: none;"></div>
    </div>
  </div>

  <script>
    let isLogin = true;

    document.getElementById('toggleBtn').addEventListener('click', function() {
      isLogin = !isLogin;
      const formTitle = document.getElementById('formTitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const registerFields = document.querySelector('.register-fields');

      if (isLogin) {
        formTitle.textContent = 'Login';
        submitBtn.textContent = 'Login';
        toggleBtn.textContent = "Don't have an account? Register";
        registerFields.style.display = 'none';
        document.getElementById('email').required = false;
        document.getElementById('address').required = false;
        document.getElementById('dob').required = false;
        document.getElementById('qualification').required = false;
      } else {
        formTitle.textContent = 'Register';
        submitBtn.textContent = 'Register';
        toggleBtn.textContent = 'Already have an account? Login';
        registerFields.style.display = 'block';
        document.getElementById('email').required = true;
        document.getElementById('address').required = true;
        document.getElementById('dob').required = true;
        document.getElementById('qualification').required = true;
      }
      document.getElementById('error').style.display = 'none';
    });

    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (isLogin) {
        // Login logic
        fetch('data.json')
          .then(response => response.json())
          .then(data => {
            const user = data.users.find(u => u.username === username && u.password === password);
            if (user) {
              localStorage.setItem('loggedInUser', JSON.stringify(user));
              window.location.href = 'dashboard.html';
            } else {
              document.getElementById('error').textContent = 'Invalid credentials';
              document.getElementById('error').style.display = 'block';
            }
          })
          .catch(error => {
            console.error('Error loading data:', error);
            document.getElementById('error').textContent = 'Error connecting to database';
            document.getElementById('error').style.display = 'block';
          });
      } else {
        // Register logic
        const email = document.getElementById('email').value;
        const address = document.getElementById('address').value;
        const dob = document.getElementById('dob').value;
        const qualification = document.getElementById('qualification').value;

        // Send POST to /register
        fetch('/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username,
            password,
            email,
            address,
            dob,
            qualification
          })
        })
        .then(response => response.json())
        .then(data => {
          alert(data.message);
          document.getElementById('toggleBtn').click(); // Switch to login
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('error').textContent = 'Registration failed';
          document.getElementById('error').style.display = 'block';
        });
      }
    });
  </script>
</body>
</html>
